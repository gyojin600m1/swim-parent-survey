<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;base-uri 'none';form-action 'none'">
<title>アンケート集計（担当者用）</title>
<link rel="stylesheet" href="style.css"></head><body>
<header class="head"><h1>アンケート集計（担当者用）</h1></header>
<main class="wrap">
<p class="note" id="sampleNote" hidden>サンプルの架空データで表示しています。</p>
<section id="login" class="card" hidden><h2 class="plain">ログイン</h2>
<div class="part"><input type="email" id="email" placeholder="メールアドレス" autocomplete="username" aria-label="メールアドレス"></div>
<div class="part"><input type="password" id="pass" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード"></div>
<div class="part"><button id="loginBtn" class="full">ログイン</button></div><div class="part" id="setupBox" hidden><button id="setupBtn" class="sub full">この内容で担当者を登録</button></div><p class="msg" id="loginMsg" role="alert"></p></section>
<section id="main" hidden>
<div class="stats"><div class="stat"><b id="sAns">-</b><span>回答数</span></div><div class="stat"><b id="sIssued">-</b><span>発行したリンク</span></div></div>
<div class="card"><div class="row"><button id="xlsxBtn">Excelで保存</button><button id="reloadBtn" class="sub">最新にする</button></div></div>
<div class="card"><h2 class="plain">個別リンクを発行</h2><p class="hint">表示されたリンクはここでしか確認できません。誰に渡したかは記録しないでください。</p>
<div class="row"><input type="number" id="n" min="1" max="400" value="20" aria-label="発行数"><button id="issueBtn">発行する</button></div>
<div class="part" id="linkBox" hidden><div class="links" id="links"></div><div class="part"><button id="copyBtn" class="sub full">リンクをすべてコピー</button></div></div>
<p class="msg" id="issueMsg" role="alert"></p></div>
<div id="result"></div></section>
</main>
<script src="config.js"></script><script src="questions.js"></script><script src="admin.js"></script>
</body></html>
