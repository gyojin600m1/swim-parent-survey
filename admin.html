<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;base-uri 'none';form-action 'none'">
<title>アンケート集計（担当者用）</title>
<link rel="stylesheet" href="style.css?v=6"></head><body>
<header class="head"><h1>アンケート集計（担当者用）</h1></header>
<main class="wrap">
<p class="note" id="sampleNote" hidden>サンプルの架空データで表示しています。</p>
<section id="login" class="card" hidden><h2 class="plain" id="loginTitle">ログイン</h2><p class="hint" id="loginHint" hidden>最初に使うIDとパスワードを決めてください。IDは英数字3〜30文字、パスワードは8文字以上です。</p>
<div class="part"><input type="text" id="loginId" placeholder="ID" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="ID"></div>
<div class="part"><input type="password" id="pass" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード"></div>
<div class="part" id="loginBox"><button id="loginBtn" class="full">ログイン</button></div><div class="part" id="setupBox" hidden><button id="setupBtn" class="full">この内容で登録する</button></div><p class="msg" id="loginMsg" role="alert"></p></section>
<section id="main" hidden>
<div class="stats"><div class="stat"><b id="sAns">-</b><span>回答数</span></div><div class="stat"><b id="sIssued">-</b><span>発行したリンク</span></div></div>
<div class="card"><div class="row"><button id="xlsxBtn">Excelで保存</button><button id="reloadBtn" class="sub">最新にする</button></div></div>
<div class="card"><h2 class="plain">個別リンクを発行</h2><p class="hint">表示されたリンクはここでしか確認できません。誰に渡したかは記録しないでください。</p>
<div class="row"><input type="number" id="n" min="1" max="400" value="20" aria-label="発行数"><button id="issueBtn">発行する</button></div>
<div class="part" id="linkBox" hidden><div class="links" id="links"></div><div class="part"><button id="copyBtn" class="sub full">リンクをすべてコピー</button></div></div>
<p class="msg" id="issueMsg" role="alert"></p></div>
<div class="card"><h2 class="plain">IDとパスワードの変更</h2><p class="hint">IDは英数字3〜30文字です。変更しない項目は空欄のままで構いません。パスワードは8文字以上にしてください。</p>
<div class="part"><input type="password" id="curPass" placeholder="現在のパスワード" autocomplete="current-password" aria-label="現在のパスワード"></div>
<div class="part"><input type="text" id="newId" placeholder="新しいID" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="新しいID"></div>
<div class="part"><input type="password" id="newPass" placeholder="新しいパスワード" autocomplete="new-password" aria-label="新しいパスワード"></div>
<div class="part"><input type="password" id="newPass2" placeholder="新しいパスワード（確認）" autocomplete="new-password" aria-label="新しいパスワード（確認）"></div>
<div class="part"><button id="changeBtn" class="full">変更する</button></div><p class="msg" id="changeMsg" role="alert"></p></div>
<div id="result"></div></section>
</main>
<script src="config.js?v=6"></script><script src="questions.js?v=6"></script><script src="admin.js?v=6"></script>
</body></html>
